# This is a basic workflow to help you get started with Actions

name: Pull Request Tests

# Runs for pull requests into develop, and for develop itself after every push.
# pull_request alone left develop untested (the push trigger was dropped in 2021
# alongside the first release workflow, which never ran tests either), and GitHub
# does not run pull_request workflows for a PR it cannot merge — a conflicting PR
# goes untested for as long as it stays conflicting.
on:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - develop

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  PullRequestTests:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    env:
      QORUS_TOKEN: ${{ secrets.QORUS_TOKEN }}
      REACT_APP_QORUS_TOKEN: ${{ secrets.QORUS_TOKEN }}
      # Upload token for qlip visual snapshots (Storybook interaction tests).
      # When unset, qlip still captures snapshots but skips the upload.
      QLIP_UPLOAD_TOKEN: ${{ secrets.QLIP_UPLOAD_TOKEN }}
    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Get current time for the commit
      - name: Get current time
        uses: josStorer/get-current-time@v2.0.2
        id: current_time
        with:
          format: YYYYMMDD-HH
          utcOffset: "+01:00"

      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Get repo
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      # One bump per PR, enforced. The rule has always been in AGENTS.md, but nothing
      # checked it, so a PR could walk 0.10.36 -> 0.10.46 a patch at a time and every
      # prerelease along the way published happily (#95). The bumps are invisible in
      # review — each diff looks correct on its own — and only the tenth is obviously
      # wrong, by which point nine version numbers have been burned that never shipped.
      #
      # Compares against the merge-base rather than develop's tip, so a branch does not
      # go red because someone else released while it was open. A rebase moves the
      # merge-base and the count recomputes from there.
      #
      # Minor and major changes are skipped, not judged: those are deliberate and this
      # check has no way to know how many are intended.
      - name: Check the version was bumped exactly once
        # Per PR only: on a push to develop the merge-base is the pushed commit.
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin develop --quiet
          BASE=$(git merge-base origin/develop HEAD)
          FROM=$(git show "$BASE:package.json" | node -pe "JSON.parse(require('fs').readFileSync(0,'utf8')).version" | cut -d- -f1)
          TO=$(node -p "require('./package.json').version" | cut -d- -f1)
          echo "merge-base: $FROM   head: $TO"

          if [ "${FROM%.*}" != "${TO%.*}" ]; then
            echo "::notice::minor/major changed ($FROM -> $TO) — bump count not checked"
            exit 0
          fi

          DELTA=$(( ${TO##*.} - ${FROM##*.} ))
          if [ "$DELTA" -lt 0 ]; then
            echo "::error::version went backwards ($FROM -> $TO)"
            exit 1
          fi
          if [ "$DELTA" -gt 1 ]; then
            echo "::error::package.json was bumped $DELTA times on this branch ($FROM -> $TO). Bump exactly once per PR — set it to $(echo $FROM | awk -F. '{print $1"."$2"."$3+1}') unless that is taken. See AGENTS.md, Versioning."
            exit 1
          fi
          echo "bumped ${DELTA}x — ok"

      - name: Print head git commit message
        id: get_head_commit_message
        run: |
          # Capture the commit subject and JSON-escape it (backslashes first, then
          # double quotes) so a message containing quotes cannot break the
          # DISCORD_EMBEDS JSON payload that interpolates this value downstream.
          msg=$(git show -s --format=%s)
          msg=${msg//\\/\\\\}
          msg=${msg//\"/\\\"}
          echo "HEAD_COMMIT_MESSAGE=$msg" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v3
        with:
          node-version: 22.19.0

      # Notify Discord to not restart server
      - name: Discord Warning
        env:
          DISCORD_WEBHOOK: ${{secrets.DISCORD_WEBHOOK_DEV}}
          # Mention someone in the embeds
          DISCORD_EMBEDS: '[{ "color":16711680, "description": ":exclamation: Tests started, **please do not restart Qorus on Rippy** for the next 30 minutes." }]'
          DISCORD_AVATAR: "https://github.com/qoretechnologies/qorus-vscode/blob/95ad81fa8654fe83bb41f68f4de42ae088298e59/public/q-symbol-small.png?raw=true"
        uses: Ilshidur/action-discord@0.3.2
        with:
          args: "<@820316067921395752>"

      - name: Save release version to outputs
        id: save_release_version
        run: echo ::set-output name=version::$(node -pe "require('./package.json').version")

      - name: Installing modules
        id: install_modules
        run: |
          yarn install

      - name: Run lint, unit tests and type checks
        id: precheck
        run: yarn precheck

      - name: Run build test
        run: |
          yarn build

      - name: Install Playwright Chromium
        id: install_playwright
        run: yarn playwright install --with-deps chromium

      - name: Run Storybook interaction tests
        id: story_tests
        run: |
          set -o pipefail
          yarn test:stories 2>&1 | tee qlip-output.log

      # qlip prints one line after uploading visual snapshots, e.g.:
      #   [qlip] uploaded build 20260629-123456 (12 fragments, …) → https://qlip.qoretechnologies.com
      # The buildId is server-assigned, so we scrape it here and expose the
      # dashboard link for the Discord message. Runs even on test failure (qlip
      # captures-on-error, so the build still exists).
      - name: Resolve qlip build link
        id: qlip
        if: always()
        run: |
          # Strip any ANSI colour codes so the scraped URL/id stay clean.
          LINE=$(grep -aE '\[qlip\] uploaded build ' qlip-output.log | tail -1 | sed -E 's/\x1b\[[0-9;]*m//g' || true)
          BUILD_ID=$(printf '%s' "$LINE" | sed -nE 's/.*uploaded build ([^ ]+) .*/\1/p')
          SERVER=$(printf '%s' "$LINE" | sed -nE 's/.* → (https?:[^ ]+).*/\1/p')
          SERVER=${SERVER:-https://qlip.qoretechnologies.com}
          echo "Resolved qlip build='${BUILD_ID:-<none>}' server='${SERVER}'"
          if [ -n "$BUILD_ID" ]; then
            echo "build_id=$BUILD_ID" >> "$GITHUB_OUTPUT"
            # Dashboard builds are global (no project): /builds/<buildId>.
            echo "url=$SERVER/builds/$BUILD_ID" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump version with timestamp and canary tag
        id: bump
        run: |
          TIMESTAMP=$(date +"%Y%m%d%H%M%S")
          NEW_VERSION=$(npm version prerelease --preid=canary.$TIMESTAMP --no-git-tag-version)
          echo "New version: $NEW_VERSION"
          echo "::set-output name=version::$NEW_VERSION"

      # Notify Discord if Success
      - name: Discord notification success
        env:
          DISCORD_WEBHOOK: ${{secrets.DISCORD_WEBHOOK}}
          DISCORD_EMBEDS: '[{ "author": {  "icon_url": "https://avatars.githubusercontent.com/${{ github.actor }}", "name": "${{ github.actor }}", "url": "https://github.com/${{github.actor}}" },"url": "https://github.com/${{github.repository}}/commit/${{github.sha}}","fields": [{ "name": "Commit Message", "value": "${{ steps.get_head_commit_message.outputs.HEAD_COMMIT_MESSAGE }}"},{ "name": "Repository", "value": "[${{github.event.repository.name}}](${{github.event.repository.clone_url}})", "inline": true },{ "name": "Branch", "value": "[${{github.ref_name}}](https://github.com/${{github.repository}}/pull/${{github.ref_name}})", "inline": true },{ "name": "Event", "value": "${{github.event_name}}", "inline": true },{ "name": "Author", "value": "[${{github.actor}}](https://github.com/${{github.actor}})", "inline": true },{ "name": "Job", "value": "${{github.job}}", "inline": true},{ "name": "Version", "value": "v${{ steps.save_release_version.outputs.version }}", "inline": true},{ "name": "", "value": "🤖 [Github Action](https://github.com/${{ github.repository}}/actions/runs/${{ github.run_id}}) 🔍 [Qlip visual tests](${{ steps.qlip.outputs.url }})"}],"color":65280,"footer":{"text": "Published at ${{steps.current_time.outputs.readableTime}}"}}]'
          DISCORD_AVATAR: "https://github.com/qoretechnologies/qorus-vscode/blob/95ad81fa8654fe83bb41f68f4de42ae088298e59/public/q-symbol-small.png?raw=true"
        uses: Ilshidur/action-discord@0.3.2
        with:
          # A push to develop has no PR to link and no canary to install.
          args: "${{ github.event_name == 'pull_request' && format(':white_check_mark: Tests run #{0} for [PR]({1}) triggered by {2} *succeeded*, install the canary version via `yarn add @qoretechnologies/reqraft@{3}`.', github.run_number, github.event.pull_request.html_url, github.triggering_actor, steps.bump.outputs.version) || format(':white_check_mark: Tests run #{0} for [develop @ {1}]({2}/{3}/commit/{4}) triggered by {5} *succeeded*.', github.run_number, github.sha, github.server_url, github.repository, github.sha, github.triggering_actor) }}"
        if: success()

      # Notify discord if failure
      - name: Discord notification failure
        env:
          DISCORD_WEBHOOK: ${{secrets.DISCORD_WEBHOOK}}
          DISCORD_EMBEDS: '[{ "author": {  "icon_url": "https://avatars.githubusercontent.com/${{ github.actor }}", "name": "${{ github.actor }}", "url": "https://github.com/${{github.actor}}" },"url": "https://github.com/${{github.repository}}/commit/${{github.sha}}","fields": [{ "name": "Commit Message", "value": "${{ steps.get_head_commit_message.outputs.HEAD_COMMIT_MESSAGE }}"},{ "name": "Repository", "value": "[${{github.event.repository.name}}](${{github.event.repository.clone_url}})", "inline": true },{ "name": "Branch", "value": "[${{github.ref_name}}](https://github.com/${{github.repository}}/pull/${{github.ref_name}})", "inline": true },{ "name": "Event", "value": "${{github.event_name}}", "inline": true },{ "name": "Author", "value": "[${{github.actor}}](https://github.com/${{github.actor}})", "inline": true },{ "name": "Job", "value": "${{github.job}}", "inline": true },{ "name": "Version", "value": "v${{ steps.save_release_version.outputs.version }}", "inline": true},{ "name": "", "value": "🤖 [Github Action](https://github.com/${{ github.repository}}/actions/runs/${{ github.run_id}}) 🔍 [Qlip visual tests](${{ steps.qlip.outputs.url }})"}],"color":16711680,"footer":{"text": "Published at ${{steps.current_time.outputs.readableTime}}"}}]'
          DISCORD_AVATAR: "https://github.com/qoretechnologies/qorus-vscode/blob/95ad81fa8654fe83bb41f68f4de42ae088298e59/public/q-symbol-small.png?raw=true"
        uses: Ilshidur/action-discord@0.3.2
        with:
          args: "${{ github.event_name == 'pull_request' && format(':exclamation: Tests run #{0} for [PR]({1}) triggered by {2} *failed*!', github.run_number, github.event.pull_request.html_url, github.triggering_actor) || format(':exclamation: Tests run #{0} for [develop @ {1}]({2}/{3}/commit/{4}) triggered by {5} *failed*!', github.run_number, github.sha, github.server_url, github.repository, github.sha, github.triggering_actor) }}"
        if: failure()

      - name: Discord notification safe to restart
        env:
          DISCORD_WEBHOOK: ${{secrets.DISCORD_WEBHOOK_DEV}}
          DISCORD_EMBEDS: '[{ "color":65280, "description": ":white_check_mark: Tests action finished. It is now safe to restart Qorus on Rippy." }]'
          DISCORD_AVATAR: "https://github.com/qoretechnologies/qorus-vscode/blob/95ad81fa8654fe83bb41f68f4de42ae088298e59/public/q-symbol-small.png?raw=true"
        uses: Ilshidur/action-discord@0.3.2
        with:
          args: "<@820316067921395752>"
        if: always()
