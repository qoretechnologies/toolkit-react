# Prerelease publish for open PRs to develop.
#
# On every push to a PR that targets `develop`, build the package, stamp a unique
# prerelease version (`<version>-pr.<PR#>.g<short-sha>`) and publish it to npm under
# the `pr` dist-tag — NOT `latest`/`beta`, so ordinary installs are never affected.
# A sticky PR comment carries the exact install command.
#
# Why: it lets consumers (qorus-ide, admin-portal) install a real, permanent reqraft
# build of an UNMERGED PR — a durable bridge until the PR merges and `beta_release`
# publishes the real version. Repoint consumers back to the released version on merge.
#
# Publishes with npm trusted publishing (OIDC): npm trusts this repository and
# this workflow file by name, so there is no stored npm credential. Restricted to
# same-repo PRs, since a fork must not be able to publish under that trust.

name: PR prerelease

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - develop

# Supersede in-flight runs when the PR gets a newer commit.
concurrency:
  group: pr-prerelease-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  # Trusted publishing: npm verifies a short-lived OIDC token minted for this
  # workflow instead of a stored credential, so the job must be allowed to
  # request one.
  id-token: write

jobs:
  Prerelease:
    # Never run for PRs opened from forks: npm trusts this repository's workflow,
    # so a fork must not be able to run under that trust.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      REACT_APP_QORUS_TOKEN: ${{ secrets.QORUS_TOKEN }}

    steps:
      # Check out the PR head exactly, so the build matches the stamped sha.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          registry-url: https://registry.npmjs.org

      # Trusted publishing is only implemented from npm 11.5.1; the npm bundled
      # with this Node is older, and would fall back to looking for a token.
      - name: Use an npm that can publish with OIDC
        run: npm install -g npm@latest

      - name: Install modules
        run: yarn install

      - name: Build
        run: yarn build

      # Stamp a unique, valid-semver prerelease of the NEXT patch (so it sorts above
      # the current release, not below it). The sha identifier is prefixed with `g`
      # (git-describe style) so an all-digit short sha can never become an invalid
      # leading-zero numeric identifier.
      - name: Stamp prerelease version
        id: version
        run: |
          NEXT=$(node -p "(v => [v[0], v[1], +v[2] + 1].join('.'))(require('./package.json').version.split('-')[0].split('.'))")
          SHA=$(printf '%s' "${{ github.event.pull_request.head.sha }}" | cut -c1-7)
          VER="${NEXT}-pr.${{ github.event.pull_request.number }}.g${SHA}"
          npm pkg set version="$VER"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "Publishing $VER"

      # Published by npm's own client so it can use the OIDC token: the publish
      # action this replaced predates trusted publishing and only knows how to
      # send a stored credential. No NPM_TOKEN is involved any more — npm trusts
      # this repository and this workflow file by name, which is why renaming
      # this file breaks publishing until the trusted publisher is updated.
      - name: Publish prerelease to npm (pr tag)
        run: npm publish --tag pr --access public

      - name: Comment install command on the PR
        uses: actions/github-script@v7
        with:
          script: |
            const version = ${{ toJSON(steps.version.outputs.version) }};
            const marker = '<!-- reqraft-pr-prerelease -->';
            const body = [
              marker,
              '📦 **Prerelease published** for this PR:',
              '',
              '```',
              `@qoretechnologies/reqraft@${version}`,
              '```',
              '',
              'Install it in a consumer (updates `package.json` + lockfile):',
              '',
              '```bash',
              `yarn add @qoretechnologies/reqraft@${version}`,
              '```',
              '',
              '_Published under the `pr` dist-tag — `latest`/`beta` are untouched. '
                + 'Repoint consumers to the released version once this PR merges._',
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
