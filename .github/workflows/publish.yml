# Everything that publishes @qoretechnologies/reqraft to npm.
#
# Both publishes live in this ONE file deliberately. npm's trusted publishing
# trusts a single workflow *file* per package, so a second publishing workflow
# has no way to authenticate -- which is why the former `pr_prerelease.yml` and
# `beta_release.yml` are merged here. Renaming this file stops publishing until
# the trusted publisher registration is updated to match.
#
# There is no npm credential: each run mints a short-lived token over OIDC. That
# also gets ahead of npm retiring 2FA-bypass tokens (account operations from
# August 2026, direct publishing from January 2027).
#
#   push to develop  -> the real version, `beta` dist-tag, tagged + released
#   pull request     -> `<next-patch>-pr.<PR#>.g<sha>`, `pr` dist-tag only
#
# The `pr` tag means an unmerged PR can be installed by a consumer (qorus-ide,
# admin-portal) without `latest`/`beta` ever moving.

name: Publish

on:
  push:
    branches:
      - develop
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - develop

permissions:
  contents: write # the release job creates the tag and the GitHub release
  pull-requests: write # the prerelease job comments the install command
  id-token: write # trusted publishing: the job must be able to request a token

jobs:
  Publish-and-release:
    # Only the branch push publishes a real version; a PR takes the job below.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      REACT_APP_QORUS_TOKEN: ${{ secrets.QORUS_TOKEN }}

    steps:
      - name: Get current time
        uses: josStorer/get-current-time@v2.0.2
        id: current_time
        with:
          format: YYYYMMDD-HH
          utcOffset: "+01:00"
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      # Checkout the repo
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      # Get commit message
      - name: Print head git commit message
        id: get_head_commit_message
        run: |
          # Capture the commit subject and JSON-escape it (backslashes first, then
          # double quotes) so a message containing quotes cannot break the
          # DISCORD_EMBEDS JSON payload that interpolates this value downstream.
          msg=$(git show -s --format=%s)
          msg=${msg//\\/\\\\}
          msg=${msg//\"/\\\"}
          echo "HEAD_COMMIT_MESSAGE=$msg" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or newer; the npm bundled with this
      # Node is older and would look for a token instead. Pinned to the 11 line
      # because npm 12 requires a newer Node than this workflow builds with.
      - name: Use an npm that can publish with OIDC
        run: npm install -g npm@^11.5.1

      - name: Save release version to outputs
        id: save_release_version
        # `$GITHUB_OUTPUT` rather than the deprecated `::set-output` command,
        # matching the prerelease job below.
        run: echo "version=$(node -pe "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Installing modules
        id: install_modules
        run: |
          yarn cache clean
          rm -rf node_modules
          yarn install

      - name: Build
        id: build
        run: yarn build

      # npm's own client, so it can authenticate with the OIDC token; the action
      # this replaced predates trusted publishing and only sends a stored one.
      - name: Publish to NPM
        id: npm_publish
        run: npm publish --tag beta --access public

      - name: Create a release
        id: release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.save_release_version.outputs.version }}
          release_name: v${{ steps.save_release_version.outputs.version }}
          body: v${{ steps.save_release_version.outputs.version }}
          draft: false
          prerelease: false

      # Notify discord if success
      - name: Discord notification
        env:
          DISCORD_WEBHOOK: ${{secrets.DISCORD_WEBHOOK}}
          DISCORD_EMBEDS: '[{"author": {"icon_url": "https://avatars.githubusercontent.com/${{ github.actor }}", "name": "${{ github.actor }}", "url": "https://github.com/${{github.actor}}"}, "url": "https://github.com/${{github.repository}}/commit/${{github.sha}}", "fields": [{ "name": "Commit Message", "value": "${{ steps.get_head_commit_message.outputs.HEAD_COMMIT_MESSAGE }}"},{"name": "Repository","value": "[${{github.event.repository.name}}](${{github.event.repository.clone_url}})","inline": true},{"name": "Branch","value": "[${{github.ref_name}}](https://github.com/${{github.repository}}/pull/${{github.ref_name}})","inline": true},{ "name": "Event", "value": "${{github.event_name}}", "inline": true },{"name": "Author","value": "[${{github.actor}}](https://github.com/${{github.actor}})","inline": true},{ "name": "Job", "value": "${{github.job}}", "inline": true },{ "name": "Version", "value": "v${{ steps.save_release_version.outputs.version }}", "inline": true},{"name": "","value": "🤖 [Github Action](https://github.com/${{ github.repository}}/actions/runs/${{ github.run_id}})"}],"color": 65280,"footer": { "text": "Published at ${{steps.current_time.outputs.readableTime}}" }}]'
          DISCORD_AVATAR: "https://github.com/qoretechnologies/reqore/blob/ae8ce24b7f0984340bf4e6835025d203d1741b3a/public/q-symbol-small.png?raw=true"
        uses: Ilshidur/action-discord@0.3.2
        with:
          args: ":white_check_mark: ReQraft beta v${{ steps.save_release_version.outputs.version }} successfuly released & published."
        if: success()

      # Notify discord if failure
      - name: Discord notification
        env:
          DISCORD_WEBHOOK: ${{secrets.DISCORD_WEBHOOK}}
          DISCORD_EMBEDS: '[{"author": {"icon_url": "https://avatars.githubusercontent.com/${{ github.actor }}", "name": "${{ github.actor }}", "url": "https://github.com/${{github.actor}}"}, "url": "https://github.com/${{github.repository}}/commit/${{github.sha}}", "fields": [{ "name": "Commit Message", "value": "${{ steps.get_head_commit_message.outputs.HEAD_COMMIT_MESSAGE }}"},{"name": "Repository","value": "[${{github.event.repository.name}}](${{github.event.repository.clone_url}})","inline": true},{"name": "Branch","value": "[${{github.ref_name}}](https://github.com/${{github.repository}}/pull/${{github.ref_name}})","inline": true},{ "name": "Event", "value": "${{github.event_name}}", "inline": true },{"name": "Author","value": "[${{github.actor}}](https://github.com/${{github.actor}})","inline": true},{ "name": "Job", "value": "${{github.job}}", "inline": true },{ "name": "Version", "value": "v${{ steps.save_release_version.outputs.version }}", "inline": true},{"name": "","value": "🤖 [Github Action](https://github.com/${{ github.repository}}/actions/runs/${{ github.run_id}})"}],"color": 16711680,"footer": { "text": "Triggered at ${{steps.current_time.outputs.readableTime}}" }}]'
          DISCORD_AVATAR: "https://github.com/qoretechnologies/reqore/blob/ae8ce24b7f0984340bf4e6835025d203d1741b3a/public/q-symbol-small.png?raw=true"
        uses: Ilshidur/action-discord@0.3.2
        with:
          args: ":exclamation: ReQraft beta v${{ steps.save_release_version.outputs.version }} release failed! Click the GitHub Action link below to find out why."
        if: failure()

  Prerelease:
    # Never run for PRs opened from forks: npm trusts this repository's workflow,
    # so a fork must not be able to publish under that trust.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # Supersede in-flight runs when the PR gets a newer commit. Scoped to this
    # job: cancelling a half-finished release on develop would be far worse.
    concurrency:
      group: pr-prerelease-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      REACT_APP_QORUS_TOKEN: ${{ secrets.QORUS_TOKEN }}

    steps:
      # Check out the PR head exactly, so the build matches the stamped sha.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          registry-url: https://registry.npmjs.org

      # Trusted publishing is only implemented from npm 11.5.1, and the npm
      # bundled with this Node (10.9.3) is older -- it would fall back to looking
      # for a token. Pinned to the 11 line rather than `latest`, because npm 12
      # requires a newer Node than this workflow builds with and refuses to
      # install here; bumping Node to suit the publish step would change the
      # runtime the package is built and tested against.
      - name: Use an npm that can publish with OIDC
        run: npm install -g npm@^11.5.1

      - name: Install modules
        run: yarn install

      - name: Build
        run: yarn build

      # Stamp a prerelease OF THE VERSION THIS PR IS RELEASING — the one already in
      # package.json, which every PR is required to bump.
      #
      # This used to increment the patch first, so a PR targeting 0.10.34 published
      # 0.10.35-pr.N. That is wrong twice over: the prerelease previews a version that
      # is not the one being merged, and it sorts ABOVE the release it precedes, so
      # the real 0.10.34 lands *below* its own preview and a consumer pinned to the
      # prerelease never moves forward on `yarn upgrade`.
      #
      # Taking package.json as-is gives the ordering the old code was reaching for
      # anyway. Semver puts a prerelease below its release and above the previous one:
      #
      #   0.10.33  <  0.10.34-pr.92.gabc123  <  0.10.34
      #
      # so it already sorts above the current release without inventing a version
      # nobody intends to ship.
      #
      # The sha identifier is prefixed with `g` (git-describe style) so an all-digit
      # short sha can never become an invalid leading-zero numeric identifier.
      #
      # Ported from reqore #635, which fixed the identical step there; the two repos
      # share this workflow shape, so they must share the correction.
      - name: Stamp prerelease version
        id: version
        run: |
          BASE=$(node -p "require('./package.json').version.split('-')[0]")
          SHA=$(printf '%s' "${{ github.event.pull_request.head.sha }}" | cut -c1-7)
          VER="${BASE}-pr.${{ github.event.pull_request.number }}.g${SHA}"

          # Publish only when package.json names a version that is not on npm yet.
          #
          # If it is already published, this PR has not bumped — either because it does
          # not need to (a CI-, docs- or test-only change) or because it forgot. Cutting
          # a prerelease of an already-released version would sort BELOW that release
          # and hand consumers something older than they have, so it is skipped rather
          # than published.
          #
          # Skipped, not failed: a workflow-only PR has nothing to preview and should
          # not go red for it. A PR that genuinely forgot its bump is still caught at
          # merge, where the release job cannot publish over an existing version.
          if npm view "$(node -p "require('./package.json').name")@${BASE}" version >/dev/null 2>&1; then
            echo "::notice::package.json is at ${BASE}, which is already published — no prerelease cut. Bump the version if this PR is meant to ship one."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          npm pkg set version="$VER"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "Publishing $VER"

      - name: Publish prerelease to npm (pr tag)
        if: steps.version.outputs.publish == 'true'
        run: npm publish --tag pr --access public

      - name: Comment install command on the PR
        if: steps.version.outputs.publish == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const version = ${{ toJSON(steps.version.outputs.version) }};
            const marker = '<!-- reqraft-pr-prerelease -->';
            const body = [
              marker,
              '📦 **Prerelease published** for this PR:',
              '',
              '```',
              `@qoretechnologies/reqraft@${version}`,
              '```',
              '',
              'Install it in a consumer (updates `package.json` + lockfile):',
              '',
              '```bash',
              `yarn add @qoretechnologies/reqraft@${version}`,
              '```',
              '',
              '_Published under the `pr` dist-tag — `latest`/`beta` are untouched. '
                + 'Repoint consumers to the released version once this PR merges._',
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
